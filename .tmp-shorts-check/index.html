<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>shorts harness</title>
  </head>
  <body>
    <!-- A Shorts shelf in the feed: no renderer around the lockup. -->
    <div id="shelf">
      <ytm-shorts-lockup-view-model id="short1">
        <a id="thumbnail" href="/shorts/one"><img src="a.jpg" /></a>
        <a href="/@badchannel">Bad Channel</a>
        <h3 class="shortsLockupViewModelHostMetadataTitle">Creepy short one</h3>
      </ytm-shorts-lockup-view-model>
      <ytm-shorts-lockup-view-model id="short2">
        <a id="thumbnail" href="/shorts/two"><img src="b.jpg" /></a>
        <a href="/@fine">Fine Channel</a>
        <h3 class="shortsLockupViewModelHostMetadataTitle">Nice short two</h3>
      </ytm-shorts-lockup-view-model>
    </div>

    <!-- A long video card, as the control. -->
    <ytd-rich-item-renderer id="long">
      <a id="thumbnail" href="/watch?v=long"><img src="c.jpg" /></a>
      <a id="video-title" href="/watch?v=long">Long video</a>
      <ytd-channel-name><a href="/@badchannel">Bad Channel</a></ytd-channel-name>
    </ytd-rich-item-renderer>

    <!-- The reels player, with its three-dot menu. -->
    <ytd-shorts id="shortsPlayer">
      <ytd-reel-video-renderer id="reel">
        <div id="player"><video></video></div>
        <ytd-reel-player-header-renderer>
          <h2 id="title">Creepy short one</h2>
          <a href="/@badchannel">Bad Channel</a>
        </ytd-reel-player-header-renderer>
        <ytd-menu-renderer>
          <button id="more" aria-label="More actions">⋮</button>
        </ytd-menu-renderer>
      </ytd-reel-video-renderer>
    </ytd-shorts>

    <div id="popup"></div>

    <pre id="result">RUNNING</pre>

    <script>
      window.MODE = new URLSearchParams(location.search).get('mode') === 'remove' ? 'remove' : 'overlay';
      const calls = [];
      window.chrome = {
        runtime: {
          sendMessage(message) {
            calls.push(message);
            if (message.type === 'rules/forContent') {
              return Promise.resolve({
                ok: true,
                data: {
                  enabled: true,
                  brainBotEnabled: true,
                  brainBotMode: window.MODE,
                  blockShorts: false,
                  blockYoutubeAds: false,
                  blockedChannelCount: 1,
                  revision: 'rev1',
                },
              });
            }
            if (message.type === 'feed/evaluate') {
              const blocked = [];
              message.cards.forEach((card, index) => {
                if ((card.channelUrl ?? '').includes('@badchannel')) {
                  blocked.push({ index, via: 'channel', matchedItem: card.channel });
                }
              });
              return Promise.resolve({ ok: true, data: { blocked } });
            }
            if (message.type === 'channel/status') {
              return Promise.resolve({ ok: true, data: { blocked: false } });
            }
            if (message.type === 'channel/block') {
              return Promise.resolve({ ok: true, data: { blocked: true } });
            }
            if (message.type === 'video/check') {
              return Promise.resolve({ ok: true, data: { blocked: false } });
            }
            if (message.type === 'page/check') {
              return Promise.resolve({ ok: true, data: { blocked: false } });
            }
            return Promise.resolve({ ok: true, data: {} });
          },
          onMessage: { addListener() {} },
        },
        storage: {
          onChanged: { addListener() {} },
        },
      };

      // Open the Shorts ⋮ menu the way YouTube does: a dropdown appears in the
      // document-level popup container, with a sheet whose list has NO role.
      document.getElementById('more').addEventListener('click', () => {
        document.getElementById('popup').innerHTML =
          '<ytd-popup-container><tp-yt-iron-dropdown>' +
          '<yt-sheet-view-model><yt-contextual-sheet-layout>' +
          '<yt-list-view-model>' +
          '<yt-list-item-view-model><button role="menuitem">Save</button></yt-list-item-view-model>' +
          '<yt-list-item-view-model><button role="menuitem">Share</button></yt-list-item-view-model>' +
          '</yt-list-view-model></yt-contextual-sheet-layout></yt-sheet-view-model>' +
          '</tp-yt-iron-dropdown></ytd-popup-container>';
      });
    </script>

    <script src="../src/content/youtube.js"></script>

    <script>
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      (async () => {
        const result = document.getElementById('result');
        const notes = [];
        try {
          await wait(900);

          const short1 = document.getElementById('short1');
          const short2 = document.getElementById('short2');
          const long = document.getElementById('long');
          const reel = document.getElementById('reel');

          const overlayMode = (window.MODE ?? 'overlay') === 'overlay';
          if (overlayMode) {
            notes.push(['short shelf overlay', Boolean(short1.querySelector('.cv-block-overlay'))]);
            notes.push(['short shelf blocked channel untouched card', !short2.querySelector('.cv-block-overlay')]);
            notes.push(['long video overlay', Boolean(long.querySelector('.cv-block-overlay'))]);
            notes.push(['shorts player overlay', Boolean(reel.querySelector('.cv-block-overlay'))]);
            notes.push(['reel paused', reel.querySelector('video').paused]);
          } else {
            notes.push(['short shelf removed', short1.style.display === 'none']);
            notes.push(['fine short kept', short2.style.display !== 'none']);
            notes.push(['long video removed', long.style.display === 'none']);
            notes.push(['shorts player removed', reel.style.display === 'none']);
          }

          // The three-dot menu: click it and wait for the entry to be injected
          // into the sheet list that has no role="menu".
          document.getElementById('more').click();
          await wait(900);
          const item = document.querySelector('.cv-menu-item');
          notes.push(['short menu entry injected', Boolean(item)]);
          notes.push(['menu entry label', item ? item.textContent.trim() === 'Block channel' : false]);

          if (item) {
            item.click();
            await wait(300);
            const block = calls.filter((call) => call.type === 'channel/block').pop();
            notes.push(['block call sent', Boolean(block)]);
            notes.push(['block targets the Short channel', block ? block.url === '/@badchannel' : false]);
            notes.push(['block source', block ? block.source === 'youtube-menu' : false]);
          }

          const failed = notes.filter(([, ok]) => !ok);
          result.textContent =
            (failed.length ? 'FAIL ' : 'PASS ') +
            notes.map(([name, ok]) => `${name}=${ok ? 'yes' : 'no'}`).join(' | ');
        } catch (error) {
          result.textContent = 'ERROR ' + error.message;
        }
      })();
    </script>
  </body>
</html>
