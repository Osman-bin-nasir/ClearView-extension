<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClearView — Settings</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <!--
      Settings is a page of sections, not a single column of cards.

      The sidebar is the navigation a settings page needs once it has more than
      one screen of content: every entry points at a real `<section id>` built by
      `options.js`, and the active state follows the scroll. The content column
      keeps a readable measure, so cards stay rows rather than stretching edge to
      edge on a wide monitor.

      The header is deliberately small: the product name and the one line that
      changes with the Protection switch. Everything that needs explaining is in
      the section it describes.
    -->
    <div class="settings-shell">
      <aside class="settings-sidebar">
        <a class="settings-brand" href="#protection" aria-label="ClearView settings">
          <span class="brand-mark" aria-hidden="true">
            <img src="../../icons/logo.png" alt="" />
          </span>
          <span class="settings-brand__text">
            <span class="settings-brand__name">ClearView</span>
            <span class="settings-brand__meta">Settings</span>
          </span>
        </a>

        <nav class="settings-nav" aria-label="Settings sections">
          <span class="settings-nav__label">Configuration</span>
          <a href="#protection" class="is-active">Protection</a>
          <a href="#youtube">YouTube</a>
          <a href="#blocked-items">Blocked items</a>
          <a href="#community">Community</a>

          <span class="settings-nav__label">Device</span>
          <a href="#activity">Activity</a>
          <a href="#security">Security</a>
          <a href="#advanced">Advanced</a>
        </nav>

        <div class="settings-sidebar__foot">
          <button class="settings-admin" id="open-admin" type="button">
            <svg
              viewBox="0 0 24 24"
              width="15"
              height="15"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M6.6 10.6h10.8a1.4 1.4 0 011.4 1.4v6.2a1.4 1.4 0 01-1.4 1.4H6.6a1.4 1.4 0 01-1.4-1.4V12a1.4 1.4 0 011.4-1.4z" />
              <path d="M8.8 10.6V8.2a3.2 3.2 0 016.4 0v2.4" />
            </svg>
            Admin dashboard
          </button>
        </div>
      </aside>

      <div class="settings-main">
        <header class="settings-topbar">
          <h1 class="settings-title">Settings</h1>
          <p class="settings-lede" id="protection-scope">
            Protection is active — websites and searches are checked before they load.
          </p>
        </header>

        <main id="content" class="settings-content"></main>
        <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
      </div>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
