<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClearView — Blocking</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="shell">
      <header class="page-header">
        <div class="row-between">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">🛡</span>
            <div>
              <h1 class="page-title">ClearView</h1>
              <p class="scope-note" id="protection-scope">
                Protection applies to websites you visit in Chrome and to Google Search.
              </p>
            </div>
          </div>
          <div class="header-actions">
            <button class="btn small" id="open-admin" type="button">Admin dashboard</button>
          </div>
        </div>
      </header>

      <main id="content"></main>
      <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
