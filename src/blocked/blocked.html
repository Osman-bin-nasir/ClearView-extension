<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocked — ClearView</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main class="card">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z" />
          <path d="M9 12l2 2 4-4" />
        </svg>
      </div>
      <h1 id="title">Content blocked</h1>
      <p id="message">ClearView stopped this page before it loaded.</p>
      <p class="note">
        Nothing about this visit was recorded or sent anywhere — the check happens on your own
        device, against the rules you have.
      </p>
      <div class="actions">
        <button id="back" class="primary" type="button">Go back</button>
        <button id="options" class="secondary" type="button">Open settings</button>
      </div>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
