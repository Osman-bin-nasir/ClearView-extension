<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ClearView</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!--
      The header is the only static markup here: the brand mark, the screen's
      name and the lock that reports whether the Protection password is set —
      none of it depends on the worker, so it is painted immediately and the popup
      never flashes empty while `state/get` is in flight. Every other row is built
      by `popup.js`, because every other row depends on state.

      The shape is the app's Protection screen cut down to a popup: the name and
      its state, the activity panel, and one quiet footer row into the rest.
    -->
    <header class="popup-head">
      <span class="brand-mark" aria-hidden="true">
        <img src="../../icons/logo.png" alt="" />
      </span>
      <div class="popup-head__text">
        <h1 class="popup-title">ClearView</h1>
        <p class="popup-sub" id="popup-status"></p>
      </div>
      <button class="icon-btn" id="popup-lock" type="button" aria-label="Protection password"></button>
    </header>

    <main id="content" aria-live="polite"></main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
